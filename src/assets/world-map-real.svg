<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <!-- Subtle Graticule Grid -->
  <g stroke="#003366" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.12">
    <line x1="0" y1="100" x2="1000" y2="100"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
  </g>
  <!-- World Continents Shapes -->
  <g fill="#003366" opacity="0.22" stroke="#003366" stroke-width="1.2" stroke-linejoin="round">
    <!-- North America -->
    <path d="M 50,70 Q 90,30 180,35 Q 260,25 340,55 Q 320,110 270,145 Q 260,190 230,225 Q 180,240 150,170 Q 130,120 50,70 Z"/>
    <path d="M 230,225 Q 275,210 300,240 Q 260,265 230,225 Z"/>
    <!-- Greenland -->
    <path d="M 345,20 Q 425,10 445,45 Q 395,85 335,65 Z"/>
    <!-- South America -->
    <path d="M 260,260 Q 340,270 385,320 Q 390,380 345,445 Q 305,485 270,440 Q 255,365 240,310 Z"/>
    <!-- Europe -->
    <path d="M 440,75 Q 520,60 570,75 Q 595,115 545,145 Q 490,145 440,75 Z"/>
    <path d="M 425,85 Q 450,110 435,130 Q 405,110 Z"/>
    <path d="M 480,35 Q 530,30 545,55 Q 495,65 480,35 Z"/>
    <!-- Africa -->
    <path d="M 445,155 Q 560,140 615,190 Q 630,265 585,345 Q 535,405 490,395 Q 470,325 425,255 Z"/>
    <path d="M 625,285 Q 650,295 640,345 Q 615,335 625,285 Z"/>
    <!-- Asia -->
    <path d="M 570,60 Q 750,35 910,70 Q 955,120 930,180 Q 860,220 780,240 Q 685,250 580,120 Z"/>
    <!-- India -->
    <path d="M 685,215 Q 750,225 725,290 Q 670,250 685,215 Z"/>
    <!-- Southeast Asia -->
    <path d="M 760,225 Q 830,235 850,280 Q 790,310 760,225 Z"/>
    <path d="M 795,310 Q 865,320 895,350 Q 825,350 795,310 Z"/>
    <!-- Japan -->
    <path d="M 895,135 Q 925,155 905,195 Q 885,165 895,135 Z"/>
    <!-- Australia & New Zealand -->
    <path d="M 760,340 Q 875,330 915,380 Q 895,450 820,460 Q 760,410 760,340 Z"/>
    <path d="M 925,410 Q 950,430 925,465 Z"/>
  </g>
</svg>
